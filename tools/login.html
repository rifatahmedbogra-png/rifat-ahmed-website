<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Rifat Tools & Documents</title>

<meta name="description" content="Rifat Tools & Documents - আপনার অ্যাকাউন্টে প্রবেশ করে অনলাইন ডিজিটাল টুলস ও সেবা ব্যবহার করুন।">
<meta name="robots" content="noindex, nofollow">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,"Noto Sans Bengali",sans-serif;
 background:linear-gradient(135deg,#071d35,#102a43,#1769aa);
 color:#fff;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:25px 15px;
}

.wrapper{width:100%;max-width:470px}

.brand{text-align:center;margin-bottom:22px}

.logo{
 width:65px;
 height:65px;
 border-radius:18px;
 background:#f0c040;
 color:#071d35;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:30px;
 font-weight:bold;
 margin:auto auto 12px;
}

.brand h1{font-size:25px;margin:8px 0}

.brand p{
 color:#d5e7f7;
 font-size:14px;
 margin:0;
 line-height:1.7;
}

.card{
 background:#fff;
 color:#183047;
 border-radius:20px;
 padding:30px;
 box-shadow:0 15px 45px #0005;
}

.card h2{
 text-align:center;
 font-size:25px;
 margin:0 0 8px;
}

.subtitle{
 text-align:center;
 color:#718096;
 font-size:14px;
 margin-bottom:25px;
 line-height:1.7;
}

label{
 display:block;
 font-size:14px;
 font-weight:bold;
 margin:17px 0 7px;
}

input{
 width:100%;
 padding:14px;
 border:1px solid #d6e0eb;
 border-radius:10px;
 font-size:15px;
 outline:none;
}

input:focus{
 border-color:#1769aa;
 box-shadow:0 0 0 3px #1769aa20;
}

.password-box{position:relative}

.password-box input{padding-right:78px}

.toggle{
 position:absolute;
 right:10px;
 top:50%;
 transform:translateY(-50%);
 border:0;
 background:none;
 color:#1769aa;
 cursor:pointer;
 font-weight:bold;
}

.options{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 margin-top:17px;
 font-size:12px;
}

.remember{
 display:flex;
 align-items:center;
 gap:6px;
 color:#64748b;
 margin:0;
}

.remember input{width:auto}

a{
 color:#1769aa;
 text-decoration:none;
 font-weight:bold;
}

a:hover{text-decoration:underline}

.submit{
 width:100%;
 padding:14px;
 margin-top:24px;
 background:linear-gradient(120deg,#1769aa,#071d35);
 color:#fff;
 border:0;
 border-radius:10px;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
}

.submit:disabled{
 opacity:.65;
 cursor:wait;
}

#message{
 display:none;
 padding:12px;
 border-radius:9px;
 margin-top:15px;
 font-size:14px;
 line-height:1.6;
}

.links{
 text-align:center;
 margin-top:20px;
 font-size:14px;
 line-height:2;
}

.home{
 display:inline-block;
 margin-top:10px;
 color:#1769aa;
}

.footer{
 text-align:center;
 color:#d5e7f7;
 font-size:12px;
 margin-top:20px;
 line-height:1.8;
}

@media(max-width:420px){
 .card{padding:23px 18px}
 .brand h1{font-size:22px}
}
</style>
</head>

<body>

<div class="wrapper">

 <div class="brand">

  <div class="logo">R</div>

  <h1>Rifat Tools & Documents</h1>

  <p>
   Online Digital Tools & Services<br>
   শিখুন, জানুন, দক্ষতা বাড়ান, আয় করুন
  </p>

 </div>

 <div class="card">

  <h2>Welcome Back!</h2>

  <div class="subtitle">
   আবারও স্বাগতম | আপনার অ্যাকাউন্টে প্রবেশ করুন
  </div>

  <form id="loginForm">

   <label for="email">
    ইমেইল ঠিকানা | Email Address
   </label>

   <input
    id="email"
    type="email"
    placeholder="আপনার ইমেইল লিখুন"
    autocomplete="username"
    maxlength="254"
    required
   >

   <label for="password">
    পাসওয়ার্ড | Password
   </label>

   <div class="password-box">

    <input
     id="password"
     type="password"
     placeholder="আপনার পাসওয়ার্ড লিখুন"
     autocomplete="current-password"
     required
    >

    <button
     class="toggle"
     type="button"
     id="togglePassword"
    >
     দেখুন | Show
    </button>

   </div>

   <div class="options">

    <label class="remember">
     <input type="checkbox" id="remember">
     মনে রাখুন | Remember me
    </label>

   </div>

   <button
    class="submit"
    id="submitBtn"
    type="submit"
   >
    লগইন করুন | Login
   </button>

   <div
    id="message"
    role="status"
    aria-live="polite"
   ></div>

  </form>

  <div class="links">

   নতুন ব্যবহারকারী? | New User?

   <br>

   <a
    id="registerLink"
    href="register.html"
   >
    নতুন অ্যাকাউন্ট তৈরি করুন | Register
   </a>

   <br>

   <a class="home" href="index.html">
    ← Back to Home
   </a>

  </div>

 </div>

 <div class="footer">
  © 2026 Rifat Tools & Documents.
  <br>
  All Rights Reserved.
 </div>

</div>

<script>
"use strict";

const API_URL =
 "https://rifat-ai-photo-editor.rifatahmedbogra.workers.dev";

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");


/* Safe return destination */

function getSafeNext() {

 const value =
  new URLSearchParams(window.location.search).get("next");

 if (!value) return "index.html";

 try {

  const base = new URL("./", window.location.href);
  const target = new URL(value, base);

  const blocked = [
   "login.html",
   "register.html",
   "registration.html",
   "admin.html"
  ];

  if (target.origin !== window.location.origin)
   return "index.html";

  if (!target.pathname.startsWith(base.pathname))
   return "index.html";

  if (
   blocked.includes(
    target.pathname.split("/").pop().toLowerCase()
   )
  ) return "index.html";

  return target.pathname + target.search + target.hash;

 } catch {

  return "index.html";

 }

}

const nextDestination = getSafeNext();

document.getElementById("registerLink").href =
 "register.html?next=" +
 encodeURIComponent(nextDestination);


/* Message */

function showMessage(text, success) {

 message.style.display = "block";

 message.style.background =
  success ? "#e7f8ed" : "#fff0f0";

 message.style.color =
  success ? "#176b36" : "#b42318";

 message.textContent = text;

}


/* Clear saved login session */

function clearSavedSession() {

 try {
  localStorage.removeItem("rifat_ai_token");
  localStorage.removeItem("rifat_ai_user");
 } catch (error) {}

 try {
  sessionStorage.removeItem("rifat_ai_token");
  sessionStorage.removeItem("rifat_ai_user");
 } catch (error) {}

}


/* Show or hide password */

document.getElementById("togglePassword")
 .addEventListener("click", function() {

  const field = document.getElementById("password");

  const show = field.type === "password";

  field.type = show ? "text" : "password";

  this.textContent =
   show ? "লুকান | Hide" : "দেখুন | Show";

 });


/* Login */

form.addEventListener("submit", async event => {

 event.preventDefault();

 const email =
  document.getElementById("email").value.trim();

 const password =
  document.getElementById("password").value;

 const remember =
  document.getElementById("remember").checked;

 if (!email || !password) {

  showMessage("ইমেইল ও পাসওয়ার্ড লিখুন।", false);
  return;

 }

 submitBtn.disabled = true;
 submitBtn.textContent = "Logging in...";

 showMessage(
  "আপনার পরিচয় যাচাই করা হচ্ছে...",
  true
 );

 let sessionSaved = false;

 try {

  /* Step 1: Verify login */

  const response = await fetch(
   API_URL + "/api/login",
   {
    method: "POST",
    headers: {
     "Content-Type": "application/json"
    },
    body: JSON.stringify({
     email: email,
     password: password
    })
   }
  );

  let data;

  try {
   data = await response.json();
  } catch {
   throw new Error(
    "সার্ভার থেকে সঠিক উত্তর পাওয়া যায়নি।"
   );
  }

  if (
   !response.ok ||
   data.success !== true ||
   !data.token
  ) {
   throw new Error(
    data.message ||
    "ইমেইল অথবা পাসওয়ার্ড সঠিক নয়।"
   );
  }


  /* Step 2: Verify admin status on server */

  showMessage(
   "সার্ভার থেকে অ্যাকাউন্টের অনুমতি যাচাই করা হচ্ছে...",
   true
  );

  const adminResponse = await fetch(
   API_URL + "/api/admin/me",
   {
    method: "GET",
    headers: {
     "Authorization": "Bearer " + data.token
    }
   }
  );

  let isAdmin = false;

  if (adminResponse.status === 403) {

   /* Authenticated user, but not an admin */
   isAdmin = false;

  } else if (adminResponse.status === 401) {

   throw new Error(
    "আপনার Login Session যাচাই করা যায়নি। আবার Login করুন।"
   );

  } else if (!adminResponse.ok) {

   throw new Error(
    "সার্ভারের Admin যাচাই সেবা এখন পাওয়া যাচ্ছে না। পরে চেষ্টা করুন।"
   );

  } else {

   let adminData;

   try {
    adminData = await adminResponse.json();
   } catch {
    throw new Error(
     "Admin যাচাইয়ের উত্তর সঠিক নয়।"
    );
   }

   if (
    adminData.success !== true ||
    !adminData.user ||
    adminData.user.role !== "admin"
   ) {
    throw new Error(
     "সার্ভারের Admin পরিচয় নিশ্চিত করা যায়নি।"
    );
   }

   isAdmin = true;

  }


  /* Step 3: Save session only after verification */

  const storage =
   remember ? localStorage : sessionStorage;

  const otherStorage =
   remember ? sessionStorage : localStorage;

  otherStorage.removeItem("rifat_ai_token");
  otherStorage.removeItem("rifat_ai_user");

  sessionSaved = true;

  storage.setItem(
   "rifat_ai_token",
   data.token
  );

  if (data.user) {
   storage.setItem(
    "rifat_ai_user",
    JSON.stringify(data.user)
   );
  }


  /* Step 4: Redirect */

  showMessage(
   "Login সফল হয়েছে। আপনাকে নিয়ে যাওয়া হচ্ছে...",
   true
  );

  if (isAdmin) {

   window.location.replace("admin.html");

  } else {

   window.location.replace(nextDestination);

  }


 } catch (error) {

  if (sessionSaved) {
   clearSavedSession();
  }

  showMessage(
   error.message ||
   "সংযোগ করা যাচ্ছে না। আবার চেষ্টা করুন।",
   false
  );

 } finally {

  submitBtn.disabled = false;

  submitBtn.textContent =
   "লগইন করুন | Login";

 }

});
</script>

</body>
</html>
