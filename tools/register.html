<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | Rifat Tools & Documents</title>
<meta name="description" content="Rifat Tools & Documents-এ নতুন অ্যাকাউন্ট তৈরি করুন এবং ডিজিটাল টুলস ব্যবহার শুরু করুন।">
<meta name="robots" content="noindex, nofollow">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,"Noto Sans Bengali",sans-serif;
 background:linear-gradient(135deg,#071d35,#102a43,#1769aa);
 color:#fff;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:25px 15px;
}

.container{width:100%;max-width:470px}

.brand{text-align:center;margin-bottom:22px}

.logo{
 width:65px;height:65px;border-radius:18px;
 background:#f0c040;color:#071d35;
 display:flex;align-items:center;justify-content:center;
 font-size:28px;font-weight:bold;
 margin:auto auto 12px;
}

.brand h1{font-size:25px;margin:8px 0}
.brand p{color:#d5e7f7;margin:0;font-size:14px}

.card{
 background:#fff;color:#183047;
 border-radius:20px;padding:30px;
 box-shadow:0 15px 45px #0005;
}

.card h2{text-align:center;margin:0 0 8px;font-size:25px}

.subtitle{
 text-align:center;color:#718096;
 font-size:14px;margin-bottom:25px;
}

label{
 display:block;font-size:14px;
 font-weight:bold;margin:15px 0 7px;
}

input{
 width:100%;padding:13px 14px;
 border:1px solid #d6e0eb;
 border-radius:10px;font-size:15px;
 outline:none;
}

input:focus{
 border-color:#1769aa;
 box-shadow:0 0 0 3px #1769aa20;
}

.password-box{position:relative}
.password-box input{padding-right:75px}

.toggle{
 position:absolute;right:10px;top:50%;
 transform:translateY(-50%);
 border:0;background:none;
 color:#1769aa;cursor:pointer;font-weight:bold;
}

.submit{
 width:100%;padding:14px;margin-top:23px;
 background:linear-gradient(120deg,#1769aa,#071d35);
 color:#fff;border:0;border-radius:10px;
 font-size:16px;font-weight:bold;cursor:pointer;
}

.submit:disabled{opacity:.65;cursor:wait}

#message{
 display:none;padding:12px;border-radius:9px;
 margin-top:15px;font-size:14px;line-height:1.6;
 overflow-wrap:anywhere;
}

.links{
 text-align:center;margin-top:20px;
 font-size:14px;line-height:2;
}

a{color:#1769aa;text-decoration:none;font-weight:bold}
.home{display:inline-block;margin-top:12px;color:#1769aa}

.footer{
 text-align:center;color:#d5e7f7;
 font-size:12px;margin-top:20px;
}

@media(max-width:420px){
 .card{padding:23px 18px}
 .brand h1{font-size:22px}
}
</style>
</head>

<body>

<div class="container">

 <div class="brand">
  <div class="logo">R</div>
  <h1>Rifat Tools & Documents</h1>
  <p>Online Digital Tools & Services</p>
  <p>শিখুন, জানুন, দক্ষতা বাড়ান, আয় করুন</p>
 </div>

 <div class="card">

  <h2>Create Your Account</h2>
  <div class="subtitle">নতুন অ্যাকাউন্ট তৈরি করুন</div>

  <form id="registerForm">

   <label for="name">Full Name | পূর্ণ নাম</label>
   <input id="name" type="text" maxlength="80"
    autocomplete="name"
    placeholder="আপনার সম্পূর্ণ নাম" required>

   <label for="email">Email Address | ইমেইল</label>
   <input id="email" type="email" maxlength="254"
    autocomplete="email"
    placeholder="example@email.com" required>

   <label for="password">Password | পাসওয়ার্ড</label>

   <div class="password-box">
    <input id="password" type="password"
     minlength="8" maxlength="128"
     autocomplete="new-password"
     placeholder="কমপক্ষে ৮ অক্ষর" required>
    <button class="toggle" type="button"
     data-target="password">Show</button>
   </div>

   <label for="confirmPassword">
    Confirm Password | পাসওয়ার্ড নিশ্চিত করুন
   </label>

   <div class="password-box">
    <input id="confirmPassword" type="password"
     minlength="8" maxlength="128"
     autocomplete="new-password"
     placeholder="আবার পাসওয়ার্ড লিখুন" required>
    <button class="toggle" type="button"
     data-target="confirmPassword">Show</button>
   </div>

   <button class="submit" id="submitBtn" type="submit">
    Create Account | অ্যাকাউন্ট তৈরি করুন
   </button>

   <div id="message" role="status" aria-live="polite"></div>

  </form>

  <div class="links">
   Already have an account?
   <a id="loginLink" href="login.html">Login Here</a>
   <br>
   <a class="home" href="index.html">← Back to Home</a>
  </div>

 </div>

 <div class="footer">
  © 2026 Rifat Tools & Documents. All Rights Reserved.
 </div>

</div>

<script>
"use strict";

const API_URL =
 "https://rifat-ai-photo-editor.rifatahmedbogra.workers.dev";

const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");

let isSubmitting = false;

function getSafeNext() {
 const value = new URLSearchParams(
  window.location.search
 ).get("next");

 if (!value) return "index.html";

 try {
  const base = new URL("./", window.location.href);
  const target = new URL(value, base);

  const blocked = [
   "login.html",
   "register.html",
   "registration.html",
   "admin.html"
  ];

  if (target.origin !== window.location.origin) {
   return "index.html";
  }

  if (!target.pathname.startsWith(base.pathname)) {
   return "index.html";
  }

  if (blocked.includes(
   target.pathname.split("/").pop().toLowerCase()
  )) {
   return "index.html";
  }

  return target.pathname + target.search + target.hash;

 } catch {
  return "index.html";
 }
}

const nextDestination = getSafeNext();

document.getElementById("loginLink").href =
 "login.html?next=" + encodeURIComponent(nextDestination);

document.querySelectorAll(".toggle").forEach(button => {

 button.addEventListener("click", () => {

  const field = document.getElementById(
   button.dataset.target
  );

  const show = field.type === "password";

  field.type = show ? "text" : "password";
  button.textContent = show ? "Hide" : "Show";

 });

});

function showMessage(text, success) {

 message.style.display = "block";

 message.style.background = success
  ? "#e7f8ed"
  : "#fff0f0";

 message.style.color = success
  ? "#176b36"
  : "#b42318";

 message.textContent = text;

}

function setSubmitting(state) {

 isSubmitting = state;
 submitBtn.disabled = state;

 submitBtn.textContent = state
  ? "Creating Account..."
  : "Create Account | অ্যাকাউন্ট তৈরি করুন";

}

form.addEventListener("submit", async event => {

 event.preventDefault();

 if (isSubmitting) {
  return;
 }

 const name = document.getElementById("name")
  .value.trim();

 const email = document.getElementById("email")
  .value.trim().toLowerCase();

 const password = document.getElementById("password")
  .value;

 const confirmPassword =
  document.getElementById("confirmPassword").value;

 if (!name || !email || !password) {
  showMessage(
   "সব তথ্য সঠিকভাবে পূরণ করুন।",
   false
  );
  return;
 }

 if (name.length < 2 || name.length > 80) {
  showMessage(
   "নাম কমপক্ষে ২ এবং সর্বোচ্চ ৮০ অক্ষরের হতে হবে।",
   false
  );
  return;
 }

 if (password.length < 8 || password.length > 128) {
  showMessage(
   "পাসওয়ার্ড ৮ থেকে ১২৮ অক্ষরের মধ্যে হতে হবে।",
   false
  );
  return;
 }

 if (password !== confirmPassword) {
  showMessage(
   "দুইটি পাসওয়ার্ড মিলছে না। আবার চেষ্টা করুন।",
   false
  );
  return;
 }

 if (!form.reportValidity()) {
  return;
 }

 setSubmitting(true);

 showMessage(
  "আপনার অ্যাকাউন্ট তৈরি করা হচ্ছে...",
  true
 );

 let registrationSuccessful = false;

 try {

  const response = await fetch(
   API_URL + "/api/register",
   {
    method: "POST",
    headers: {
     "Content-Type": "application/json"
    },
    body: JSON.stringify({
     name,
     email,
     password
    })
   }
  );

  let data;

  try {
   data = await response.json();
  } catch {
   throw new Error(
    "সার্ভার থেকে সঠিক উত্তর পাওয়া যায়নি।"
   );
  }

  if (!response.ok || data.success !== true) {
   throw new Error(
    data.message ||
    "Registration করা যায়নি।"
   );
  }

  registrationSuccessful = true;

  showMessage(
   "অ্যাকাউন্ট তৈরি সফল হয়েছে। এখন Login পেজে নেওয়া হচ্ছে...",
   true
  );

  form.reset();

  const loginUrl =
   "login.html?next=" +
   encodeURIComponent(nextDestination);

  window.location.replace(loginUrl);

 } catch (error) {

  showMessage(
   error.message ||
   "সার্ভারের সঙ্গে সংযোগ করা যাচ্ছে না।",
   false
  );

 } finally {

  if (!registrationSuccessful) {
   setSubmitting(false);
  }

 }

});
</script>

</body>
</html>
