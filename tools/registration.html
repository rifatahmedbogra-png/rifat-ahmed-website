<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | Rifat AI Photo Studio</title>
<meta name="description" content="Create your account at Rifat AI Photo Studio.">
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#071d35,#102a43,#1769aa);
 color:#fff;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:25px 15px;
}
.container{width:100%;max-width:470px}
.brand{text-align:center;margin-bottom:22px}
.logo{
 width:65px;height:65px;border-radius:18px;
 background:#f0c040;color:#071d35;
 display:flex;align-items:center;justify-content:center;
 font-size:28px;font-weight:bold;margin:auto auto 12px;
}
.brand h1{font-size:25px;margin:8px 0}
.brand p{color:#d5e7f7;margin:0;font-size:14px}
.card{
 background:#fff;color:#183047;
 border-radius:20px;padding:30px;
 box-shadow:0 15px 45px #0005;
}
.card h2{text-align:center;margin:0 0 8px;font-size:25px}
.subtitle{text-align:center;color:#718096;font-size:14px;margin-bottom:25px}
label{display:block;font-size:14px;font-weight:bold;margin:15px 0 7px}
input{
 width:100%;padding:13px 14px;border:1px solid #d6e0eb;
 border-radius:10px;font-size:15px;outline:none;
}
input:focus{border-color:#1769aa;box-shadow:0 0 0 3px #1769aa20}
.password-box{position:relative}
.password-box input{padding-right:75px}
.toggle{
 position:absolute;right:10px;top:50%;transform:translateY(-50%);
 border:0;background:none;color:#1769aa;cursor:pointer;font-weight:bold;
}
.submit{
 width:100%;padding:14px;margin-top:23px;
 background:linear-gradient(120deg,#1769aa,#071d35);
 color:#fff;border:0;border-radius:10px;
 font-size:16px;font-weight:bold;cursor:pointer;
}
.submit:disabled{opacity:.65;cursor:wait}
#message{
 display:none;padding:12px;border-radius:9px;
 margin-top:15px;font-size:14px;line-height:1.6;
}
.links{text-align:center;margin-top:20px;font-size:14px;line-height:2}
a{color:#1769aa;text-decoration:none;font-weight:bold}
.home{display:inline-block;margin-top:12px;color:#f0c040}
.footer{text-align:center;color:#d5e7f7;font-size:12px;margin-top:20px}
@media(max-width:420px){.card{padding:23px 18px}.brand h1{font-size:22px}}
</style>
</head>
<body>
<div class="container">
 <div class="brand">
  <div class="logo">R</div>
  <h1>Rifat AI Photo Studio</h1>
  <p>Professional Photo Editing Platform</p>
 </div>

 <div class="card">
  <h2>Create Your Account</h2>
  <div class="subtitle">নতুন অ্যাকাউন্ট তৈরি করুন</div>

  <form id="registerForm">
   <label for="name">Full Name | পূর্ণ নাম</label>
   <input id="name" type="text" maxlength="80" placeholder="আপনার সম্পূর্ণ নাম" required>

   <label for="email">Email Address | ইমেইল</label>
   <input id="email" type="email" maxlength="150" placeholder="example@email.com" required>

   <label for="password">Password | পাসওয়ার্ড</label>
   <div class="password-box">
    <input id="password" type="password" minlength="8" placeholder="কমপক্ষে ৮ অক্ষর" required>
    <button class="toggle" type="button" data-target="password">Show</button>
   </div>

   <label for="confirmPassword">Confirm Password | পাসওয়ার্ড নিশ্চিত করুন</label>
   <div class="password-box">
    <input id="confirmPassword" type="password" minlength="8" placeholder="আবার পাসওয়ার্ড লিখুন" required>
    <button class="toggle" type="button" data-target="confirmPassword">Show</button>
   </div>

   <button class="submit" id="submitBtn" type="submit">Create Account | অ্যাকাউন্ট তৈরি করুন</button>
   <div id="message" role="status" aria-live="polite"></div>
  </form>

  <div class="links">
   Already have an account? <a href="login.html">Login Here</a>
   <br>
   <a class="home" href="index.html">← Back to Home</a>
  </div>
 </div>

 <div class="footer">© 2026 Rifat AI Photo Studio. All Rights Reserved.</div>
</div>

<script>
const API_URL="https://rifat-ai-photo-editor.rifatahmedbogra.workers.dev";

const form=document.getElementById("registerForm");
const message=document.getElementById("message");
const submitBtn=document.getElementById("submitBtn");

document.querySelectorAll(".toggle").forEach(button=>{
 button.addEventListener("click",()=>{
  const field=document.getElementById(button.dataset.target);
  const show=field.type==="password";
  field.type=show?"text":"password";
  button.textContent=show?"Hide":"Show";
 });
});

function showMessage(text,success){
 message.style.display="block";
 message.style.background=success?"#e7f8ed":"#fff0f0";
 message.style.color=success?"#176b36":"#b42318";
 message.textContent=text;
}

form.addEventListener("submit",async function(e){
 e.preventDefault();

 const name=document.getElementById("name").value.trim();
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const confirmPassword=document.getElementById("confirmPassword").value;

 if(password.length<8){
  showMessage("পাসওয়ার্ড কমপক্ষে ৮ অক্ষরের হতে হবে।",false);
  return;
 }

 if(password!==confirmPassword){
  showMessage("দুইটি পাসওয়ার্ড মিলছে না। আবার চেষ্টা করুন।",false);
  return;
 }

 submitBtn.disabled=true;
 submitBtn.textContent="Creating Account...";
 showMessage("Backend-এর সঙ্গে সংযোগ করা হচ্ছে...",true);

 try{
  const response=await fetch(API_URL+"/api/register",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({name,email,password})
  });

  const data=await response.json();

  if(!response.ok){
   throw new Error(data.message||data.error||"Registration failed.");
  }

  if(data.token){
   sessionStorage.setItem("rifat_ai_token",data.token);
  }

  showMessage(data.message||"Registration successful! এখন Login করুন।",true);
  form.reset();

 }catch(error){
  showMessage(error.message||"সংযোগ করা যাচ্ছে না। আবার চেষ্টা করুন।",false);
 }finally{
  submitBtn.disabled=false;
  submitBtn.textContent="Create Account | অ্যাকাউন্ট তৈরি করুন";
 }
});
</script>
</body>
</html>
